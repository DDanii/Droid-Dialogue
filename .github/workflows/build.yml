name: Build APK

# Every push and pull request runs the tests and builds an APK you can download from the run page.
# Pushing a tag such as v1.0.0 also publishes a GitHub release with the APK attached:
#     git tag v1.0.0 && git push origin v1.0.0
#
# Optional repository secrets for a stable signing key (otherwise a temporary debug key is used,
# and each new build must be installed over the old one only after uninstalling it):
#   ANDROID_KEYSTORE_BASE64    base64 -w0 of your .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run tests
        run: bash ./test.sh

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$REF_NAME' is not a valid version tag. Use e.g. v1.2.3 or v1.2.3-beta.1"
              exit 1
            fi
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then PRE=true; else PRE=false; fi
            echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.0-${SHA:0:7}"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, signing with a temporary debug key."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_ENABLED" = "true" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            export KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          fi
          bash ./build.sh

      - name: Collect files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/droid-dialogue-satellite-*.apk dist/
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --target "$SHA" \
              --title "Droid Dialogue Satellite $TAG" \
              --notes "Android APK for Android 4.0 and newer. SHA-256 checksums are in SHA256SUMS.txt." \
              --generate-notes \
              "${FLAGS[@]}"
          fi
